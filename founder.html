<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Founder Panel — Nailong Digital</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<style>
  :root{
    --bg:#FDF8F5;--ink:#000000;--paper:#FFFFFF;
    --accent:#FFDE00;--accent2:#C4F000;--muted:#444444;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Arial Black','Segoe UI',sans-serif;}
  body{
    background:var(--bg);min-height:100vh;padding:36px 16px 80px;color:var(--ink);
    background-image:radial-gradient(rgba(0,0,0,.08) 1px, transparent 1px);
    background-size:24px 24px;
  }
  .logo{
    display:none;width:fit-content;margin:0 auto 28px;background:var(--ink);color:var(--accent);
    padding:12px 26px;font-size:22px;font-weight:900;border:4px solid var(--ink);
    border-radius:999px;box-shadow:6px 6px 0 var(--accent);letter-spacing:1px;
  }
  #loginScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;}
  .login-card{
    background:var(--paper);border:4px solid var(--ink);border-radius:28px;
    box-shadow:8px 8px 0 var(--ink);padding:32px 28px;width:100%;max-width:420px;
  }
  .login-card h2{font-size:18px;font-weight:900;text-transform:uppercase;margin-bottom:6px;}
  .login-card h2 i{margin-right:6px;}
  .login-card p{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:22px;}
  .login-card label{display:block;font-size:12px;font-weight:900;text-transform:uppercase;margin-bottom:8px;}
  .login-card input{
    width:100%;border:4px solid var(--ink);border-radius:999px;padding:13px 18px;
    font-size:14px;font-weight:700;background:var(--bg);box-shadow:4px 4px 0 var(--ink);
    outline:none;margin-bottom:16px;font-family:inherit;color:var(--ink);transition:.12s;
  }
  .login-card input:focus{background:var(--paper);box-shadow:4px 4px 0 var(--accent);border-color:var(--accent);}
  .pass-wrap{position:relative;margin-bottom:16px;}
  .pass-wrap input{margin-bottom:0;padding-right:48px;}
  .toggle-eye{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    background:transparent;border:none;cursor:pointer;font-size:16px;color:var(--ink);
    padding:4px;width:auto;box-shadow:none;
  }
  .toggle-eye:hover{background:transparent;transform:translateY(-50%);box-shadow:none;}
  .login-card button[type="submit"]{
    width:100%;background:var(--accent);color:var(--ink);border:4px solid var(--ink);
    border-radius:999px;padding:14px;font-size:14px;font-weight:900;text-transform:uppercase;
    letter-spacing:.5px;cursor:pointer;box-shadow:5px 5px 0 var(--ink);font-family:inherit;
    transition:transform .08s, box-shadow .08s;
  }
  .login-card button[type="submit"]:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink);}
  .login-card button[type="submit"]:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink);}
  .error{color:#CC0000;font-size:12px;font-weight:900;margin-top:12px;text-align:center;}
  #dashboard{display:none;}
  .dash-header{
    max-width:820px;margin:0 auto 22px;display:flex;justify-content:space-between;
    align-items:center;gap:12px;flex-wrap:wrap;
  }
  .dash-header h2{
    background:var(--ink);color:var(--accent);padding:10px 20px;font-size:16px;font-weight:900;
    border:4px solid var(--ink);border-radius:999px;box-shadow:4px 4px 0 var(--accent);
  }
  .dash-header h2 i{margin-right:6px;}
  .logout{
    width:auto;background:var(--ink);color:var(--paper);border:4px solid var(--ink);
    border-radius:999px;padding:10px 18px;font-size:12px;font-weight:900;cursor:pointer;
    box-shadow:4px 4px 0 var(--ink);font-family:inherit;text-transform:uppercase;
    transition:transform .08s, box-shadow .08s;
  }
  .logout i{margin-right:6px;}
  .logout:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}
  .stats{max-width:820px;margin:0 auto 22px;display:flex;gap:12px;flex-wrap:wrap;}
  .stat{
    flex:1;min-width:130px;background:var(--paper);border:4px solid var(--ink);
    border-radius:20px;box-shadow:5px 5px 0 var(--ink);padding:16px;text-align:center;
  }
  .stat:nth-child(1){background:var(--accent);}
  .stat:nth-child(2){background:var(--accent2);}
  .stat .num{font-size:28px;font-weight:900;}
  .stat .lbl{font-size:10px;font-weight:900;text-transform:uppercase;color:var(--ink);}
  .stat .lbl i{margin-right:4px;}
  .list{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px;}
  .item{
    background:var(--paper);border:4px solid var(--ink);border-radius:24px;
    box-shadow:6px 6px 0 var(--ink);padding:20px;position:relative;
  }
  .item .badge{
    position:absolute;top:-13px;right:16px;background:var(--accent);border:3px solid var(--ink);
    border-radius:999px;padding:3px 12px;font-size:10px;font-weight:900;
    box-shadow:2px 2px 0 var(--ink);
  }
  .item .badge i{margin-right:4px;}
  .item h3{font-size:15px;margin-bottom:5px;padding-right:70px;font-weight:900;}
  .item h3 i{margin-right:6px;}
  .item .meta{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:12px;}
  .item .meta i{margin-right:4px;}
  .item .desc{
    font-size:13px;font-weight:700;line-height:1.55;background:var(--bg);
    border:3px solid var(--ink);border-radius:18px;padding:13px 15px;margin-bottom:12px;
    white-space:pre-wrap;
  }
  .file-link{
    display:inline-block;background:var(--accent2);border:3px solid var(--ink);
    border-radius:999px;padding:8px 14px;font-size:11px;font-weight:900;
    text-decoration:none;color:var(--ink);box-shadow:3px 3px 0 var(--ink);
    margin-bottom:10px;transition:transform .08s, box-shadow .08s;
  }
  .file-link i{margin-right:6px;}
  .file-link:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
  .delete-btn{
    display:block;width:auto;background:#FF4444;color:var(--paper);
    border:3px solid var(--ink);border-radius:999px;padding:8px 14px;
    font-size:11px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 var(--ink);
    font-family:inherit;text-transform:uppercase;margin-left:auto;
    transition:transform .08s, box-shadow .08s;
  }
  .delete-btn i{margin-right:6px;}
  .delete-btn:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
  .empty{
    text-align:center;background:var(--paper);border:4px solid var(--ink);border-radius:24px;
    box-shadow:6px 6px 0 var(--ink);padding:40px 20px;font-weight:900;
    font-size:13px;color:var(--muted);
  }
  .empty i{font-size:28px;display:block;margin-bottom:10px;color:var(--ink);}
  @media (max-width:480px){
    .login-card{padding:26px 20px;border-radius:24px;}
    .item{padding:18px;border-radius:20px;}
  }
</style>
</head>
<body>

<div class="logo" id="logo">NAILONG <i class="fa-solid fa-star"></i> FOUNDER</div>

<div id="loginScreen">
  <div class="login-card">
    <h2><i class="fa-solid fa-lock"></i> Founder Login</h2>
    <p>Masukkan kredensial untuk akses panel.</p>
    <form id="loginForm">
      <label for="user">Username</label>
      <input type="text" id="user" placeholder="Username" autocomplete="off" required />
      <label for="pass">Password</label>
      <div class="pass-wrap">
        <input type="password" id="pass" placeholder="Password" required />
        <button type="button" class="toggle-eye" id="toggleEye" title="Lihat password">
          <i class="fa-solid fa-eye"></i>
        </button>
      </div>
      <button type="submit"><i class="fa-solid fa-right-to-bracket"></i> Masuk</button>
      <div class="error" id="loginError" style="display:none;">Username / Password salah!</div>
    </form>
  </div>
</div>

<div id="dashboard">
  <div class="dash-header">
    <h2><i class="fa-solid fa-inbox"></i> Saran Masuk</h2>
    <button class="logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="num" id="totalSaran">0</div><div class="lbl"><i class="fa-solid fa-envelope"></i> Total Saran</div></div>
    <div class="stat"><div class="num" id="totalFile">0</div><div class="lbl"><i class="fa-solid fa-paperclip"></i> Dengan File</div></div>
  </div>
  <div class="list" id="listSaran"></div>
</div>

<script>
  /* ============================================================
     KREDENSIAL DISAMARKAN (base64 + reverse)
     Asli: Username = Rafyan, Password = Rafyan826
     Di source code TIDAK keliatan teks aslinya.
     ============================================================ */
  const _u = 'bmF5ZmFS'; // "Rafyan" dibalik lalu di-base64
  const _p = 'NjI4bmF5ZmFS'; // "Rafyan826" dibalik lalu di-base64

  function _dec(s){
    // base64 decode lalu reverse
    return atob(s).split('').reverse().join('');
  }

  // ===== IndexedDB =====
  const DB_NAME = 'nailong_db';
  const STORE = 'saran';
  let db = null;

  function openDB(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: 'id' });
      };
      req.onsuccess = (e) => { db = e.target.result; resolve(db); };
      req.onerror = (e) => reject(e.target.error);
    });
  }

  function getAllSaran(){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = (e) => reject(e.target.error);
    });
  }

  function deleteSaranDB(id){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = (e) => reject(e.target.error);
    });
  }

  // ===== TOMBOL MATA =====
  const passInput = document.getElementById('pass');
  const toggleEye = document.getElementById('toggleEye');
  toggleEye.addEventListener('click', () => {
    if (passInput.type === 'password') {
      passInput.type = 'text';
      toggleEye.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
    } else {
      passInput.type = 'password';
      toggleEye.innerHTML = '<i class="fa-solid fa-eye"></i>';
    }
  });

  // ===== LOGIN =====
  window.addEventListener('DOMContentLoaded', async () => {
    await openDB();
    if (sessionStorage.getItem('nailong_logged') === '1') showDashboard();
  });

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const u = document.getElementById('user').value.trim();
    const p = document.getElementById('pass').value;

    if (u === _dec(_u) && p === _dec(_p)) {
      sessionStorage.setItem('nailong_logged', '1');
      showDashboard();
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  });

  function showDashboard() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('logo').style.display = 'block';
    renderSaran();
  }

  function logout() {
    sessionStorage.removeItem('nailong_logged');
    location.reload();
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }

  async function renderSaran() {
    const list = await getAllSaran();
    const container = document.getElementById('listSaran');
    document.getElementById('totalSaran').textContent = list.length;
    document.getElementById('totalFile').textContent = list.filter(s => s.file).length;

    if (list.length === 0) {
      container.innerHTML = '<div class="empty"><i class="fa-solid fa-inbox"></i> Belum ada saran masuk.</div>';
      return;
    }

    list.sort((a, b) => (b.tanggal || '').localeCompare(a.tanggal || ''));

    container.innerHTML = list.map(s => `
      <div class="item">
        <div class="badge"><i class="fa-regular fa-clock"></i>${escapeHtml(s.tanggal)}</div>
        <h3><i class="fa-solid fa-lightbulb"></i>${escapeHtml(s.fitur)}</h3>
        <div class="meta"><i class="fa-solid fa-user"></i> Dari: <b>${escapeHtml(s.nama)}</b></div>
        <div class="desc">${escapeHtml(s.deskripsi)}</div>
        ${s.file ? `<a class="file-link" data-file-id="${s.id}" href="#"><i class="fa-solid fa-paperclip"></i>${escapeHtml(s.file.name)} (${(s.file.size/1024/1024).toFixed(2)} MB)</a>` : ''}
        <button class="delete-btn" onclick="hapusSaran('${s.id}')"><i class="fa-solid fa-trash"></i> Hapus</button>
      </div>
    `).join('');

    container.querySelectorAll('.file-link').forEach(link => {
      link.addEventListener('click', async (e) => {
        e.preventDefault();
        const id = link.getAttribute('data-file-id');
        const all = await getAllSaran();
        const item = all.find(x => x.id === id);
        if (!item || !item.file) return;
        const url = URL.createObjectURL(item.file.blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = item.file.name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      });
    });
  }

  async function hapusSaran(id) {
    if (!confirm('Yakin hapus saran ini?')) return;
    await deleteSaranDB(id);
    renderSaran();
  }
</script>
</body>
</html>
