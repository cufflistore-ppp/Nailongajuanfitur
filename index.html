<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ajukan Fitur — Nailong Digital</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<style>
  :root{
    --bg:#FDF8F5;
    --ink:#000000;
    --paper:#FFFFFF;
    --accent:#FFDE00;
    --accent2:#C4F000;
    --muted:#444444;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Arial Black','Segoe UI',sans-serif;}
  body{
    background:var(--bg);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 16px 80px;
    color:var(--ink);
    background-image:radial-gradient(rgba(0,0,0,.08) 1px, transparent 1px);
    background-size:24px 24px;
  }
  .header{text-align:center;margin-bottom:28px;}
  .logo{
    display:inline-block;
    background:var(--ink);
    color:var(--accent);
    padding:14px 28px;
    font-size:24px;
    font-weight:900;
    border:4px solid var(--ink);
    border-radius:999px;
    box-shadow:6px 6px 0 var(--accent);
    margin-bottom:16px;
    letter-spacing:1px;
  }
  .header p{
    background:var(--paper);
    border:4px solid var(--ink);
    border-radius:999px;
    box-shadow:4px 4px 0 var(--ink);
    padding:9px 20px;
    display:inline-block;
    font-size:13px;
    font-weight:800;
  }
  .header p i{color:#E5A800;margin-right:6px;}

  .card{
    background:var(--paper);
    border:4px solid var(--ink);
    border-radius:28px;
    box-shadow:8px 8px 0 var(--ink);
    width:100%;
    max-width:600px;
    padding:30px 26px;
  }
  .card h2{font-size:19px;font-weight:900;text-transform:uppercase;margin-bottom:6px;}
  .card h2 i{margin-right:6px;}
  .card .sub{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:22px;}

  label{
    display:block;
    font-size:12px;
    font-weight:900;
    text-transform:uppercase;
    margin-bottom:8px;
  }
  input[type="text"], textarea{
    width:100%;
    border:4px solid var(--ink);
    border-radius:999px;
    padding:13px 18px;
    font-size:14px;
    font-weight:700;
    font-family:inherit;
    background:var(--bg);
    box-shadow:4px 4px 0 var(--ink);
    outline:none;
    margin-bottom:18px;
    color:var(--ink);
    transition:.12s;
  }
  textarea{
    border-radius:22px;
    min-height:110px;
    resize:vertical;
  }
  input:focus, textarea:focus{
    background:var(--paper);
    box-shadow:4px 4px 0 var(--accent);
    border-color:var(--accent);
  }

  .upload-box{
    border:4px dashed var(--ink);
    border-radius:24px;
    padding:18px;
    text-align:center;
    background:var(--bg);
    margin-bottom:18px;
    cursor:pointer;
    transition:.15s;
  }
  .upload-box:hover{background:var(--accent);}
  .upload-box input{display:none;}
  .upload-box span{font-size:13px;font-weight:800;}
  .upload-box i{margin-right:4px;}
  #fileName{
    display:block;
    margin-top:6px;
    font-size:11px;
    font-weight:700;
    color:var(--muted);
    word-break:break-all;
  }

  button.submit{
    width:100%;
    background:var(--accent);
    color:var(--ink);
    border:4px solid var(--ink);
    border-radius:999px;
    padding:15px;
    font-size:14px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.5px;
    cursor:pointer;
    box-shadow:5px 5px 0 var(--ink);
    transition:transform .08s, box-shadow .08s;
    font-family:inherit;
  }
  button.submit i{margin-right:6px;}
  button.submit:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink);}
  button.submit:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink);}
  button.submit:disabled{opacity:.6;cursor:not-allowed;transform:none;}

  .toast{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%) translateY(-200px);
    background:var(--accent2);
    color:var(--ink);
    border:4px solid var(--ink);
    border-radius:999px;
    box-shadow:5px 5px 0 var(--ink);
    padding:12px 22px;
    font-weight:900;
    font-size:13px;
    z-index:99;
    transition:.3s;
    max-width:90%;
    text-align:center;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast i{margin-right:6px;}

  .toast.error{background:#FF6B6B;color:#FFF;}

  .progress{
    width:100%;
    height:14px;
    border:3px solid var(--ink);
    border-radius:999px;
    background:var(--bg);
    overflow:hidden;
    margin-bottom:16px;
    display:none;
  }
  .progress.show{display:block;}
  .progress-bar{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width .2s;
  }

  @media (max-width:480px){
    .card{padding:24px 18px;border-radius:24px;}
    .logo{font-size:20px;padding:12px 22px;}
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">NAILONG DIGITAL</div>
  <p><i class="fa-solid fa-lightbulb"></i> Ajukan Fitur / Kasih Saran</p>
</div>

<div class="card">
  <h2><i class="fa-solid fa-pen-to-square"></i> Formulir Saran</h2>
  <p class="sub">Saran lo langsung masuk ke developer.</p>

  <form id="formSaran">
    <label for="nama">Nama kamu</label>
    <input type="text" id="nama" placeholder="Contoh: Nailong" required />

    <label for="fitur">Nama Fitur</label>
    <input type="text" id="fitur" placeholder="Contoh: Mode Gelap Otomatis" required />

    <label for="deskripsi">Deskripsi Saran</label>
    <textarea id="deskripsi" placeholder="Jelaskan fitur atau saran kamu di sini..." required></textarea>

    <label>Lampiran File (opsional, maks 40MB)</label>
    <div class="upload-box" onclick="document.getElementById('file').click()">
      <span><i class="fa-solid fa-paperclip"></i> Klik untuk upload file</span>
      <span id="fileName">Belum ada file dipilih</span>
      <input type="file" id="file" />
    </div>

    <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>

    <button type="submit" class="submit" id="submitBtn"><i class="fa-solid fa-paper-plane"></i> Kirim Saran</button>
  </form>
</div>

<div class="toast" id="toast"><i class="fa-solid fa-circle-check"></i> Saran berhasil dikirim!</div>

<script>
  const MAX_SIZE = 40 * 1024 * 1024; // 40MB

  // ===== IndexedDB helper =====
  const DB_NAME = 'nailong_db';
  const STORE = 'saran';
  let db = null;

  function openDB(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains(STORE)) {
          d.createObjectStore(STORE, { keyPath: 'id' });
        }
      };
      req.onsuccess = (e) => { db = e.target.result; resolve(db); };
      req.onerror = (e) => reject(e.target.error);
    });
  }

  function addSaranDB(saran){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(saran);
      tx.oncomplete = () => resolve();
      tx.onerror = (e) => reject(e.target.error);
    });
  }

  const fileInput = document.getElementById('file');
  const fileNameEl = document.getElementById('fileName');
  const toast = document.getElementById('toast');

  function showToast(msg, isError){
    toast.innerHTML = '<i class="fa-solid ' + (isError ? 'fa-circle-xmark' : 'fa-circle-check') + '"></i> ' + msg;
    toast.classList.toggle('error', !!isError);
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2800);
  }

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length === 0) {
      fileNameEl.textContent = 'Belum ada file dipilih';
      return;
    }
    const f = fileInput.files[0];
    const mb = (f.size / 1024 / 1024).toFixed(2);
    if (f.size > MAX_SIZE) {
      fileNameEl.textContent = f.name + ' (' + mb + ' MB) — DITOLAK, maks 40MB';
      fileNameEl.style.color = '#CC0000';
    } else {
      fileNameEl.textContent = f.name + ' (' + mb + ' MB)';
      fileNameEl.style.color = 'var(--muted)';
    }
  });

  document.getElementById('formSaran').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const progress = document.getElementById('progress');
    const bar = document.getElementById('progressBar');

    const nama = document.getElementById('nama').value.trim();
    const fitur = document.getElementById('fitur').value.trim();
    const deskripsi = document.getElementById('deskripsi').value.trim();
    const file = fileInput.files[0];

    // Tolak kalau file > 40MB
    if (file && file.size > MAX_SIZE) {
      showToast('File lebih dari 40MB, ditolak.', true);
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengirim...';
    progress.classList.add('show');
    bar.style.width = '10%';

    try {
      if (!db) await openDB();

      let fileBlob = null;
      if (file) {
        fileBlob = file;
        bar.style.width = '50%';
      }

      const saran = {
        id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
        nama, fitur, deskripsi,
        file: fileBlob ? {
          name: fileBlob.name,
          type: fileBlob.type,
          size: fileBlob.size,
          blob: fileBlob
        } : null,
        tanggal: new Date().toLocaleString('id-ID')
      };

      await addSaranDB(saran);
      bar.style.width = '100%';

      e.target.reset();
      fileNameEl.textContent = 'Belum ada file dipilih';
      fileNameEl.style.color = 'var(--muted)';

      showToast('Saran berhasil dikirim!', false);
    } catch (err) {
      console.error(err);
      showToast('Gagal menyimpan: ' + err.message, true);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Kirim Saran';
      setTimeout(() => { progress.classList.remove('show'); bar.style.width = '0%'; }, 800);
    }
  });
</script>
</body>
</html>
